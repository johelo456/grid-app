<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>grid. - Parrilla de Contenido</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { 
  font-family: Arial, sans-serif;
  background: #0a0a0a; 
  color: #fff;
}
.container { max-width: 1000px; margin: 0 auto; padding: 20px; }
.login-screen { display: none; }
.login-screen.show { display: block; }
.admin-screen { display: none; }
.admin-screen.show { display: block; }
.login-box { background: #1a1a1a; padding: 40px; border-radius: 8px; max-width: 400px; margin: 100px auto; }
.login-box h1 { margin-bottom: 20px; text-align: center; }
.form-group { margin-bottom: 15px; }
.form-group label { display: block; margin-bottom: 5px; }
.form-group input { width: 100%; padding: 10px; background: #0a0a0a; border: 1px solid #333; border-radius: 4px; color: #fff; }
.btn { width: 100%; padding: 10px; background: #7c3aed; border: none; border-radius: 4px; color: #fff; cursor: pointer; font-weight: bold; }
.btn:hover { background: #6d28d9; }
.error { color: #ef4444; font-size: 12px; margin-top: 10px; }
.topbar { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; border-bottom: 1px solid #333; margin-bottom: 20px; }
.topbar h1 { margin: 0; }
.btn-logout { background: #374151; color: #fff; padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
.stat-card { background: #1a1a1a; padding: 20px; border-radius: 8px; }
.stat-label { font-size: 12px; color: #999; margin-bottom: 10px; }
.stat-value { font-size: 32px; font-weight: bold; }
.btn-new { background: #7c3aed; color: #fff; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; margin-bottom: 20px; }
.calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; margin-bottom: 30px; }
.day-header { text-align: center; color: #999; padding: 10px 0; font-weight: bold; }
.day { background: #1a1a1a; padding: 10px; border-radius: 4px; min-height: 100px; border: 1px solid #333; cursor: pointer; }
.day:hover { background: #252525; }
.day-number { font-weight: bold; margin-bottom: 5px; }
.day-posts { font-size: 11px; }
.day-post { background: #0a0a0a; padding: 3px 6px; margin: 3px 0; border-radius: 3px; cursor: pointer; }
.posts { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
.post-card { background: #1a1a1a; border-radius: 8px; overflow: hidden; border: 1px solid #333; }
.post-header { padding: 15px; border-bottom: 1px solid #333; }
.post-title { font-weight: bold; margin-bottom: 5px; }
.post-meta { font-size: 12px; color: #999; }
.post-image { width: 100%; aspect-ratio: 1; object-fit: cover; background: #0a0a0a; }
.post-body { padding: 15px; }
.post-copy { margin-bottom: 10px; line-height: 1.5; }
.post-networks { display: flex; gap: 5px; margin-bottom: 10px; flex-wrap: wrap; }
.post-network { font-size: 11px; background: #0a0a0a; padding: 3px 8px; border-radius: 4px; }
.post-status { display: inline-block; font-size: 11px; padding: 3px 8px; border-radius: 4px; font-weight: bold; }
.status-pending { background: #92400e; color: #fcd34d; }
.status-approved { background: #065f46; color: #10b981; }
.post-actions { padding: 10px 15px; border-top: 1px solid #333; display: flex; gap: 8px; }
.post-actions button { flex: 1; padding: 6px; background: #0a0a0a; border: 1px solid #333; border-radius: 4px; color: #fff; cursor: pointer; font-size: 12px; }
.post-actions button:hover { background: #252525; }
.modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1000; }
.modal.show { display: flex; align-items: center; justify-content: center; }
.modal-content { background: #1a1a1a; padding: 30px; border-radius: 8px; width: 90%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
.modal-title { font-size: 20px; font-weight: bold; margin-bottom: 20px; }
.form-group textarea { width: 100%; padding: 10px; background: #0a0a0a; border: 1px solid #333; border-radius: 4px; color: #fff; font-family: Arial; min-height: 100px; resize: vertical; }
.checkbox-group { display: flex; gap: 15px; margin: 15px 0; flex-wrap: wrap; }
.checkbox-group label { display: flex; align-items: center; gap: 5px; cursor: pointer; }
.img-upload { border: 2px dashed #333; padding: 20px; text-align: center; border-radius: 4px; cursor: pointer; margin: 15px 0; }
.img-preview { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 15px 0; }
.img-thumb { position: relative; aspect-ratio: 1; border-radius: 4px; overflow: hidden; border: 1px solid #333; }
.img-thumb img { width: 100%; height: 100%; object-fit: cover; }
.img-remove { position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; background: rgba(0,0,0,0.9); border: none; color: #fff; cursor: pointer; border-radius: 50%; }
.modal-buttons { display: flex; gap: 10px; margin-top: 20px; }
.modal-buttons button { flex: 1; padding: 10px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
.modal-buttons .cancel { background: #374151; color: #fff; }
.modal-buttons .save { background: #7c3aed; color: #fff; }
.modal-close { position: absolute; top: 10px; right: 10px; background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; }
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-screen show">
  <div class="container">
    <div class="login-box">
      <h1>grid. צור</h1>
      <p style="text-align: center; color: #999; margin-bottom: 30px;">Parrilla de Contenido</p>
      
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="loginEmail" value="admin@tsur.com">
      </div>
      
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" id="loginPassword" value="admin123">
      </div>
      
      <button class="btn" onclick="login()">Ingresar</button>
      <div id="loginError" class="error"></div>
    </div>
  </div>
</div>

<!-- ADMIN -->
<div class="admin-screen">
  <div class="container">
    <div class="topbar">
      <h1>grid. צור</h1>
      <div>
        <span id="userEmail" style="color: #999; margin-right: 20px;"></span>
        <button class="btn-logout" onclick="logout()">Cerrar sesión</button>
      </div>
    </div>

    <div class="stats">
      <div class="stat-card">
        <div class="stat-label">TOTAL POSTS</div>
        <div class="stat-value" id="statTotal">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">APROBADOS</div>
        <div class="stat-value" style="color: #10b981;" id="statApproved">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">PENDIENTES</div>
        <div class="stat-value" style="color: #f59e0b;" id="statPending">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">RECHAZADOS</div>
        <div class="stat-value" style="color: #ef4444;" id="statRejected">0</div>
      </div>
    </div>

    <button class="btn-new" onclick="openNewPost()">+ Nuevo Post</button>

    <h2 style="margin-bottom: 20px;">CALENDARIO</h2>
    <div id="calendarMonthYear" style="margin-bottom: 10px; text-align: center; font-weight: bold;"></div>
    <div style="margin-bottom: 10px; text-align: center;">
      <button class="btn" style="width: auto; padding: 8px 15px; margin-right: 10px;" onclick="prevMonth()">‹ Anterior</button>
      <button class="btn" style="width: auto; padding: 8px 15px;" onclick="nextMonth()">Siguiente ›</button>
    </div>
    <div class="calendar" id="calendar"></div>

    <h2 style="margin-bottom: 20px;">POSTS RECIENTES</h2>
    <div class="posts" id="postsContainer"></div>
  </div>
</div>

<!-- MODAL -->
<div id="postModal" class="modal">
  <div class="modal-content">
    <button class="modal-close" onclick="closeModal()">×</button>
    <div class="modal-title" id="modalTitle">Nuevo Post</div>
    
    <div class="form-group">
      <label>Título</label>
      <input type="text" id="postTitle" placeholder="Ej. Promo Verano">
    </div>

    <div class="form-group">
      <label>Fecha</label>
      <input type="date" id="postDate">
    </div>

    <div class="form-group">
      <label>Texto</label>
      <textarea id="postCopy" placeholder="Escribe el texto del post..."></textarea>
    </div>

    <div class="form-group">
      <label>Redes Sociales</label>
      <div class="checkbox-group">
        <label><input type="checkbox" id="net-ig" checked> Instagram</label>
        <label><input type="checkbox" id="net-fb"> Facebook</label>
        <label><input type="checkbox" id="net-tt"> TikTok</label>
        <label><input type="checkbox" id="net-li"> LinkedIn</label>
      </div>
    </div>

    <div class="form-group">
      <label>Imágenes</label>
      <div class="img-upload" onclick="document.getElementById('fileInput').click()">
        📎 Haz clic para agregar imágenes (máximo 6)
      </div>
      <input type="file" id="fileInput" accept="image/*" multiple style="display: none" onchange="handleFiles()">
      <div class="img-preview" id="imgPreview"></div>
    </div>

    <div class="modal-buttons">
      <button class="cancel" onclick="closeModal()">Cancelar</button>
      <button class="save" onclick="savePost()">Guardar</button>
    </div>
  </div>
</div>

<script>
// ===== DATOS EN MEMORIA =====
let currentUser = null;
let posts = [];
let uploadedImages = [];
let editingId = null;
let currentMonth = new Date().getMonth();
let currentYear = new Date().getFullYear();

const MONTHS = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
const DAYS = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];

// ===== LOGIN =====
function login() {
  const email = document.getElementById('loginEmail').value;
  const password = document.getElementById('loginPassword').value;
  const error = document.getElementById('loginError');
  
  if (email === 'admin@tsur.com' && password === 'admin123') {
    currentUser = { email: email };
    error.textContent = '';
    showAdminScreen();
    renderCalendar();
    renderPosts();
  } else {
    error.textContent = 'Email o contraseña incorrectos';
  }
}

function logout() {
  currentUser = null;
  posts = [];
  document.querySelector('.login-screen').classList.add('show');
  document.querySelector('.admin-screen').classList.remove('show');
}

function showAdminScreen() {
  document.querySelector('.login-screen').classList.remove('show');
  document.querySelector('.admin-screen').classList.add('show');
  document.getElementById('userEmail').textContent = currentUser.email;
}

// ===== POSTS =====
function openNewPost(dateStr) {
  editingId = null;
  uploadedImages = [];
  document.getElementById('modalTitle').textContent = 'Nuevo Post';
  document.getElementById('postTitle').value = '';
  document.getElementById('postDate').value = dateStr || '';
  document.getElementById('postCopy').value = '';
  document.getElementById('fileInput').value = '';
  document.getElementById('imgPreview').innerHTML = '';
  document.getElementById('net-ig').checked = true;
  document.getElementById('net-fb').checked = false;
  document.getElementById('net-tt').checked = false;
  document.getElementById('net-li').checked = false;
  document.getElementById('postModal').classList.add('show');
}

function closeModal() {
  document.getElementById('postModal').classList.remove('show');
}

function savePost() {
  const title = document.getElementById('postTitle').value.trim();
  const date = document.getElementById('postDate').value;
  const copy = document.getElementById('postCopy').value.trim();
  
  if (!title || !date || !copy) {
    alert('Por favor completa: Título, Fecha y Texto');
    return;
  }

  const networks = [];
  if (document.getElementById('net-ig').checked) networks.push('Instagram');
  if (document.getElementById('net-fb').checked) networks.push('Facebook');
  if (document.getElementById('net-tt').checked) networks.push('TikTok');
  if (document.getElementById('net-li').checked) networks.push('LinkedIn');

  const postData = {
    id: editingId || 'post_' + Date.now(),
    title,
    date,
    copy,
    networks,
    images: uploadedImages,
    status: 'pending'
  };

  if (editingId) {
    const idx = posts.findIndex(p => p.id === editingId);
    if (idx >= 0) posts[idx] = postData;
  } else {
    posts.push(postData);
  }

  closeModal();
  renderCalendar();
  renderPosts();
  updateStats();
}

function deletePost(id) {
  if (confirm('¿Eliminar?')) {
    posts = posts.filter(p => p.id !== id);
    renderCalendar();
    renderPosts();
    updateStats();
  }
}

function editPost(id) {
  const post = posts.find(p => p.id === id);
  editingId = id;
  uploadedImages = [...(post.images || [])];
  
  document.getElementById('modalTitle').textContent = 'Editar Post';
  document.getElementById('postTitle').value = post.title;
  document.getElementById('postDate').value = post.date;
  document.getElementById('postCopy').value = post.copy;
  document.getElementById('net-ig').checked = post.networks.includes('Instagram');
  document.getElementById('net-fb').checked = post.networks.includes('Facebook');
  document.getElementById('net-tt').checked = post.networks.includes('TikTok');
  document.getElementById('net-li').checked = post.networks.includes('LinkedIn');
  
  renderImagePreview();
  document.getElementById('postModal').classList.add('show');
}

function updateStatus(id, status) {
  const post = posts.find(p => p.id === id);
  if (post) {
    post.status = status;
    renderPosts();
    updateStats();
  }
}

// ===== IMÁGENES =====
function handleFiles() {
  const files = document.getElementById('fileInput').files;
  Array.from(files).forEach(file => {
    if (uploadedImages.length < 6) {
      const reader = new FileReader();
      reader.onload = (e) => {
        uploadedImages.push(e.target.result);
        renderImagePreview();
      };
      reader.readAsDataURL(file);
    }
  });
}

function renderImagePreview() {
  const preview = document.getElementById('imgPreview');
  preview.innerHTML = uploadedImages.map((img, idx) => `
    <div class="img-thumb">
      <img src="${img}">
      <button class="img-remove" onclick="removeImage(${idx})">×</button>
    </div>
  `).join('');
}

function removeImage(idx) {
  uploadedImages.splice(idx, 1);
  renderImagePreview();
}

// ===== CALENDARIO =====
function renderCalendar() {
  document.getElementById('calendarMonthYear').textContent = MONTHS[currentMonth] + ' ' + currentYear;
  
  const cal = document.getElementById('calendar');
  cal.innerHTML = '';
  
  DAYS.forEach(d => {
    const h = document.createElement('div');
    h.className = 'day-header';
    h.textContent = d;
    cal.appendChild(h);
  });

  const first = new Date(currentYear, currentMonth, 1).getDay();
  const days = new Date(currentYear, currentMonth + 1, 0).getDate();

  for (let i = 0; i < first; i++) {
    const d = new Date(currentYear, currentMonth, 0 - first + i + 2);
    const cell = document.createElement('div');
    cell.className = 'day';
    cell.style.opacity = '0.3';
    cell.innerHTML = `<div class="day-number">${d.getDate()}</div>`;
    cal.appendChild(cell);
  }

  for (let d = 1; d <= days; d++) {
    const dt = new Date(currentYear, currentMonth, d);
    const iso = formatDateISO(dt);
    const dayPosts = posts.filter(p => p.date === iso);
    
    const cell = document.createElement('div');
    cell.className = 'day';
    cell.innerHTML = `<div class="day-number">${d}</div><div class="day-posts">${dayPosts.map(p => `<div class="day-post" onclick="editPost('${p.id}')" title="${p.title}">${p.title}</div>`).join('')}</div>`;
    cell.onclick = () => openNewPost(iso);
    cal.appendChild(cell);
  }

  const rem = 42 - (first + days);
  for (let i = 1; i <= rem; i++) {
    const d = new Date(currentYear, currentMonth + 1, i);
    const cell = document.createElement('div');
    cell.className = 'day';
    cell.style.opacity = '0.3';
    cell.innerHTML = `<div class="day-number">${d.getDate()}</div>`;
    cal.appendChild(cell);
  }
}

function prevMonth() {
  currentMonth--;
  if (currentMonth < 0) {
    currentMonth = 11;
    currentYear--;
  }
  renderCalendar();
}

function nextMonth() {
  currentMonth++;
  if (currentMonth > 11) {
    currentMonth = 0;
    currentYear++;
  }
  renderCalendar();
}

// ===== RENDER =====
function renderPosts() {
  const container = document.getElementById('postsContainer');
  
  if (posts.length === 0) {
    container.innerHTML = '<p style="grid-column: 1/-1; color: #999; text-align: center; padding: 40px;">No hay posts aún</p>';
    return;
  }

  container.innerHTML = posts.map(p => {
    let imgHtml = '';
    if (p.images && p.images.length > 0) {
      imgHtml = `<img src="${p.images[0]}" class="post-image">`;
    }

    return `
      <div class="post-card">
        <div class="post-header">
          <div class="post-title">${p.title}</div>
          <div class="post-meta">${p.date}</div>
          <span class="post-status status-${p.status}">
            ${p.status === 'approved' ? '✓ Aprobado' : '○ Pendiente'}
          </span>
        </div>
        ${imgHtml}
        <div class="post-body">
          <div class="post-copy">${p.copy}</div>
          <div class="post-networks">
            ${p.networks.map(n => `<span class="post-network">${n}</span>`).join('')}
          </div>
        </div>
        <div class="post-actions">
          <button onclick="editPost('${p.id}')">Editar</button>
          <button onclick="deletePost('${p.id}')">Eliminar</button>
          <button onclick="updateStatus('${p.id}', 'approved')">Aprobar</button>
        </div>
      </div>
    `;
  }).join('');
}

function updateStats() {
  const total = posts.length;
  const approved = posts.filter(p => p.status === 'approved').length;
  const pending = posts.filter(p => p.status === 'pending').length;
  const rejected = posts.filter(p => p.status === 'rejected').length;

  document.getElementById('statTotal').textContent = total;
  document.getElementById('statApproved').textContent = approved;
  document.getElementById('statPending').textContent = pending;
  document.getElementById('statRejected').textContent = rejected;
}

function formatDateISO(date) {
  return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0') + '-' + String(date.getDate()).padStart(2, '0');
}

// ===== INIT =====
updateStats();
</script>

</body>
</html>
