<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>grid. צור - Content Management</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%;
  height: 100%;
}

body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: linear-gradient(135deg, #0f0f1e 0%, #1a0f2e 100%);
  color: #e0e0e0;
  min-height: 100vh;
}

/* LOGIN */
.login-screen {
  display: none;
  position: fixed;
  inset: 0;
  background: linear-gradient(135deg, #0f0f1e 0%, #1a0f2e 100%);
  z-index: 9999;
}

.login-screen.show {
  display: flex;
  align-items: center;
  justify-content: center;
}

.login-box {
  background: rgba(255, 255, 255, 0.05);
  backdrop-filter: blur(10px);
  padding: 50px 40px;
  border-radius: 20px;
  max-width: 420px;
  width: 90%;
  border: 1px solid rgba(255, 255, 255, 0.1);
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
}

.login-box h1 {
  font-size: 32px;
  margin-bottom: 10px;
  text-align: center;
  background: linear-gradient(135deg, #7c3aed, #ec4899);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.login-box p {
  text-align: center;
  color: #a0a0b0;
  margin-bottom: 30px;
}

.form-group {
  margin-bottom: 20px;
}

.form-group label {
  display: block;
  margin-bottom: 8px;
  font-size: 14px;
  color: #b0b0c0;
  font-weight: 500;
}

.form-group input {
  width: 100%;
  padding: 12px 16px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 10px;
  color: #e0e0e0;
  font-size: 14px;
  transition: all 0.3s ease;
}

.form-group input:focus {
  outline: none;
  background: rgba(255, 255, 255, 0.12);
  border-color: #7c3aed;
  box-shadow: 0 0 20px rgba(124, 58, 237, 0.3);
}

.btn {
  width: 100%;
  padding: 12px;
  background: linear-gradient(135deg, #7c3aed, #ec4899);
  border: none;
  border-radius: 10px;
  color: #fff;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
  box-shadow: 0 4px 15px rgba(124, 58, 237, 0.3);
}

.btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(124, 58, 237, 0.4);
}

.btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.error {
  color: #ff6b6b;
  font-size: 13px;
  margin-top: 12px;
  text-align: center;
}

/* ADMIN SCREEN */
.admin-screen {
  display: none;
}

.admin-screen.show {
  display: block;
}

.sidebar {
  position: fixed;
  left: 0;
  top: 0;
  width: 250px;
  height: 100vh;
  background: rgba(15, 15, 30, 0.8);
  border-right: 1px solid rgba(255, 255, 255, 0.1);
  padding: 30px 20px;
  overflow-y: auto;
  backdrop-filter: blur(10px);
  z-index: 100;
}

.sidebar h2 {
  font-size: 20px;
  margin-bottom: 30px;
  background: linear-gradient(135deg, #7c3aed, #ec4899);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.sidebar-menu {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.sidebar-item {
  padding: 12px 15px;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.3s ease;
  border: 1px solid transparent;
  font-size: 14px;
}

.sidebar-item:hover {
  background: rgba(124, 58, 237, 0.2);
  border-color: rgba(124, 58, 237, 0.5);
}

.sidebar-item.active {
  background: rgba(124, 58, 237, 0.3);
  border-color: #7c3aed;
}

.main-content {
  margin-left: 250px;
  padding: 30px;
  min-height: 100vh;
}

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 40px;
  padding-bottom: 20px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}

.topbar h1 {
  font-size: 24px;
}

.topbar-right {
  display: flex;
  align-items: center;
  gap: 20px;
}

.user-info {
  text-align: right;
}

.user-info p {
  font-size: 13px;
  color: #a0a0b0;
}

.btn-logout {
  background: rgba(255, 107, 107, 0.2);
  border: 1px solid rgba(255, 107, 107, 0.5);
  color: #ff6b6b;
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 13px;
  transition: all 0.3s ease;
}

.btn-logout:hover {
  background: rgba(255, 107, 107, 0.3);
}

.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 20px;
  margin-bottom: 40px;
}

.stat-card {
  background: rgba(255, 255, 255, 0.05);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  padding: 25px;
  border-radius: 15px;
  transition: all 0.3s ease;
}

.stat-card:hover {
  background: rgba(255, 255, 255, 0.08);
  border-color: rgba(124, 58, 237, 0.3);
  transform: translateY(-3px);
}

.stat-label {
  font-size: 12px;
  color: #a0a0b0;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 12px;
}

.stat-value {
  font-size: 36px;
  font-weight: 700;
  background: linear-gradient(135deg, #7c3aed, #ec4899);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.section-title {
  font-size: 20px;
  margin-bottom: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.btn-new {
  background: linear-gradient(135deg, #7c3aed, #ec4899);
  color: #fff;
  padding: 10px 24px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  font-weight: 600;
  font-size: 13px;
  transition: all 0.3s ease;
  box-shadow: 0 4px 15px rgba(124, 58, 237, 0.3);
}

.btn-new:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(124, 58, 237, 0.4);
}

/* CALENDAR */
.calendar-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.calendar-nav button {
  background: rgba(124, 58, 237, 0.2);
  border: 1px solid rgba(124, 58, 237, 0.5);
  color: #7c3aed;
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 13px;
  margin: 0 5px;
  transition: all 0.3s ease;
}

.calendar-nav button:hover {
  background: rgba(124, 58, 237, 0.3);
}

.calendar {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 10px;
  margin-bottom: 40px;
  background: rgba(255, 255, 255, 0.03);
  padding: 20px;
  border-radius: 15px;
  border: 1px solid rgba(255, 255, 255, 0.1);
}

.day-header {
  text-align: center;
  font-size: 12px;
  color: #a0a0b0;
  padding: 10px 0;
  font-weight: 600;
  text-transform: uppercase;
}

.day {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  padding: 12px;
  border-radius: 12px;
  min-height: 110px;
  cursor: pointer;
  transition: all 0.3s ease;
  position: relative;
}

.day:hover {
  background: rgba(124, 58, 237, 0.15);
  border-color: rgba(124, 58, 237, 0.5);
  transform: translateY(-2px);
}

.day.other-month {
  opacity: 0.3;
  cursor: default;
}

.day.other-month:hover {
  transform: none;
  background: rgba(255, 255, 255, 0.05);
  border-color: rgba(255, 255, 255, 0.1);
}

.day-number {
  font-weight: 700;
  font-size: 14px;
  margin-bottom: 8px;
  color: #e0e0e0;
}

.day-posts {
  font-size: 11px;
  max-height: 60px;
  overflow: hidden;
}

.day-post {
  background: rgba(124, 58, 237, 0.3);
  padding: 4px 8px;
  margin: 3px 0;
  border-radius: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  cursor: pointer;
  transition: all 0.2s ease;
  border-left: 2px solid #7c3aed;
}

.day-post:hover {
  background: rgba(124, 58, 237, 0.5);
}

.day-post.pending {
  border-left-color: #f59e0b;
}

.day-post.approved {
  border-left-color: #10b981;
}

/* POSTS GRID */
.posts {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
  gap: 25px;
}

.post-card {
  background: rgba(255, 255, 255, 0.05);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 15px;
  overflow: hidden;
  transition: all 0.3s ease;
}

.post-card:hover {
  background: rgba(255, 255, 255, 0.08);
  border-color: rgba(124, 58, 237, 0.3);
  transform: translateY(-5px);
  box-shadow: 0 10px 30px rgba(124, 58, 237, 0.2);
}

.post-header {
  padding: 20px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}

.post-title {
  font-weight: 700;
  font-size: 16px;
  margin-bottom: 8px;
}

.post-meta {
  font-size: 12px;
  color: #a0a0b0;
  display: flex;
  justify-content: space-between;
}

.post-image {
  width: 100%;
  aspect-ratio: 16/9;
  object-fit: cover;
  background: rgba(0, 0, 0, 0.3);
}

.post-body {
  padding: 20px;
}

.post-copy {
  font-size: 13px;
  line-height: 1.6;
  margin-bottom: 15px;
  color: #c0c0d0;
  white-space: pre-wrap;
}

.post-networks {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 15px;
}

.post-network {
  font-size: 11px;
  background: rgba(124, 58, 237, 0.2);
  border: 1px solid rgba(124, 58, 237, 0.4);
  color: #a8d5ff;
  padding: 4px 10px;
  border-radius: 6px;
}

.post-status {
  display: inline-block;
  font-size: 11px;
  padding: 4px 12px;
  border-radius: 6px;
  font-weight: 600;
  margin-bottom: 12px;
}

.status-pending {
  background: rgba(245, 158, 11, 0.2);
  color: #fcd34d;
  border: 1px solid rgba(245, 158, 11, 0.4);
}

.status-approved {
  background: rgba(16, 185, 129, 0.2);
  color: #6ee7b7;
  border: 1px solid rgba(16, 185, 129, 0.4);
}

.post-actions {
  display: flex;
  gap: 8px;
  padding: 15px 20px;
  border-top: 1px solid rgba(255, 255, 255, 0.1);
}

.post-actions button {
  flex: 1;
  padding: 8px 12px;
  background: rgba(124, 58, 237, 0.2);
  border: 1px solid rgba(124, 58, 237, 0.4);
  border-radius: 8px;
  color: #a8d5ff;
  cursor: pointer;
  font-size: 11px;
  font-weight: 600;
  transition: all 0.2s ease;
}

.post-actions button:hover {
  background: rgba(124, 58, 237, 0.4);
  border-color: rgba(124, 58, 237, 0.6);
}

/* MODAL */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.6);
  z-index: 1000;
  backdrop-filter: blur(4px);
}

.modal.show {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal-content {
  background: rgba(20, 20, 40, 0.95);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 20px;
  width: 100%;
  max-width: 550px;
  max-height: 90vh;
  overflow-y: auto;
  padding: 30px;
}

.modal-title {
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 25px;
  background: linear-gradient(135deg, #7c3aed, #ec4899);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.modal-close {
  position: absolute;
  top: 20px;
  right: 20px;
  background: none;
  border: none;
  color: #a0a0b0;
  font-size: 28px;
  cursor: pointer;
  transition: all 0.2s ease;
}

.modal-close:hover {
  color: #e0e0e0;
  transform: rotate(90deg);
}

.form-group {
  margin-bottom: 20px;
}

.form-group label {
  display: block;
  margin-bottom: 8px;
  font-size: 13px;
  color: #b0b0c0;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.form-group input,
.form-group textarea {
  width: 100%;
  padding: 12px 16px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 10px;
  color: #e0e0e0;
  font-size: 14px;
  font-family: inherit;
  transition: all 0.3s ease;
}

.form-group input:focus,
.form-group textarea:focus {
  outline: none;
  background: rgba(255, 255, 255, 0.08);
  border-color: #7c3aed;
  box-shadow: 0 0 20px rgba(124, 58, 237, 0.2);
}

.form-group textarea {
  min-height: 120px;
  resize: vertical;
}

.checkbox-group {
  display: flex;
  gap: 15px;
  flex-wrap: wrap;
  margin: 15px 0;
}

.checkbox-group label {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  font-size: 13px;
  text-transform: none;
  letter-spacing: normal;
  font-weight: 500;
}

.checkbox-group input[type="checkbox"] {
  width: 18px;
  height: 18px;
  cursor: pointer;
  accent-color: #7c3aed;
}

.img-upload {
  border: 2px dashed rgba(124, 58, 237, 0.5);
  padding: 30px 20px;
  text-align: center;
  border-radius: 12px;
  cursor: pointer;
  margin: 15px 0;
  transition: all 0.3s ease;
  background: rgba(124, 58, 237, 0.05);
}

.img-upload:hover {
  border-color: #7c3aed;
  background: rgba(124, 58, 237, 0.1);
}

.img-preview {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin: 15px 0;
}

.img-thumb {
  position: relative;
  aspect-ratio: 1;
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid rgba(255, 255, 255, 0.1);
}

.img-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.img-remove {
  position: absolute;
  top: 5px;
  right: 5px;
  width: 24px;
  height: 24px;
  background: rgba(255, 107, 107, 0.8);
  border: none;
  color: #fff;
  cursor: pointer;
  border-radius: 50%;
  font-size: 16px;
  transition: all 0.2s ease;
}

.img-remove:hover {
  background: #ff6b6b;
}

.modal-buttons {
  display: flex;
  gap: 12px;
  margin-top: 30px;
}

.modal-buttons button {
  flex: 1;
  padding: 12px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  font-weight: 600;
  font-size: 14px;
  transition: all 0.3s ease;
}

.modal-buttons .cancel {
  background: rgba(255, 255, 255, 0.1);
  color: #e0e0e0;
  border: 1px solid rgba(255, 255, 255, 0.2);
}

.modal-buttons .cancel:hover {
  background: rgba(255, 255, 255, 0.15);
}

.modal-buttons .save {
  background: linear-gradient(135deg, #7c3aed, #ec4899);
  color: #fff;
  box-shadow: 0 4px 15px rgba(124, 58, 237, 0.3);
}

.modal-buttons .save:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(124, 58, 237, 0.4);
}

/* RESPONSIVE */
@media (max-width: 768px) {
  .sidebar {
    width: 200px;
  }

  .main-content {
    margin-left: 200px;
    padding: 20px;
  }

  .stats {
    grid-template-columns: repeat(2, 1fr);
  }

  .posts {
    grid-template-columns: 1fr;
  }

  .calendar {
    grid-template-columns: repeat(7, 1fr);
    gap: 5px;
    padding: 10px;
  }

  .day {
    min-height: 80px;
    padding: 8px;
  }

  .day-posts {
    max-height: 40px;
  }
}

@media (max-width: 600px) {
  .sidebar {
    width: 150px;
    padding: 20px 10px;
  }

  .main-content {
    margin-left: 150px;
    padding: 15px;
  }

  .stats {
    grid-template-columns: 1fr;
  }

  .sidebar h2 {
    font-size: 14px;
  }

  .sidebar-item {
    padding: 10px 12px;
    font-size: 12px;
  }
}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-screen show">
  <div class="login-box">
    <h1>grid. צור</h1>
    <p>Content Management Platform</p>
    
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="loginEmail" value="admin@tsur.com">
    </div>
    
    <div class="form-group">
      <label>Contraseña</label>
      <input type="password" id="loginPassword" value="admin123">
    </div>
    
    <button class="btn" onclick="login()">Ingresar</button>
    <div id="loginError" class="error"></div>
  </div>
</div>

<!-- ADMIN -->
<div class="admin-screen">
  <!-- SIDEBAR -->
  <div class="sidebar">
    <h2>grid. צור</h2>
    <div class="sidebar-menu">
      <div class="sidebar-item active">📊 Dashboard</div>
      <div class="sidebar-item">📅 Calendario</div>
      <div class="sidebar-item">👥 Empresas</div>
      <div class="sidebar-item">⚙️ Configuración</div>
    </div>
  </div>

  <!-- MAIN CONTENT -->
  <div class="main-content">
    <!-- TOPBAR -->
    <div class="topbar">
      <h1>Dashboard</h1>
      <div class="topbar-right">
        <div class="user-info">
          <p>Bienvenido</p>
          <p id="userEmail" style="font-weight: 600;"></p>
        </div>
        <button class="btn-logout" onclick="logout()">Salir</button>
      </div>
    </div>

    <!-- STATS -->
    <div class="stats">
      <div class="stat-card">
        <div class="stat-label">Total Posts</div>
        <div class="stat-value" id="statTotal">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Aprobados</div>
        <div class="stat-value" id="statApproved">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Pendientes</div>
        <div class="stat-value" id="statPending">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Rechazados</div>
        <div class="stat-value" id="statRejected">0</div>
      </div>
    </div>

    <!-- CALENDAR SECTION -->
    <div style="margin-bottom: 40px;">
      <div class="section-title">
        <span>📅 Calendario</span>
        <div class="calendar-nav">
          <button onclick="prevMonth()">‹</button>
          <span id="calendarMonthYear" style="color: #b0b0c0; font-size: 14px; min-width: 150px; text-align: center;"></span>
          <button onclick="nextMonth()">›</button>
        </div>
      </div>
      <div class="calendar" id="calendar"></div>
    </div>

    <!-- POSTS SECTION -->
    <div>
      <div class="section-title">
        <span>📮 Posts Recientes</span>
        <button class="btn-new" onclick="openNewPost()">+ Nuevo Post</button>
      </div>
      <div class="posts" id="postsContainer"></div>
    </div>
  </div>
</div>

<!-- MODAL -->
<div id="postModal" class="modal">
  <div class="modal-content">
    <button class="modal-close" onclick="closeModal()">×</button>
    <div class="modal-title" id="modalTitle">Nuevo Post</div>
    
    <div class="form-group">
      <label>Título</label>
      <input type="text" id="postTitle" placeholder="Ej. Promo Verano 2025">
    </div>

    <div class="form-group">
      <label>Fecha</label>
      <input type="date" id="postDate">
    </div>

    <div class="form-group">
      <label>Texto</label>
      <textarea id="postCopy" placeholder="Escribe el texto del post..."></textarea>
    </div>

    <div class="form-group">
      <label>Redes Sociales</label>
      <div class="checkbox-group">
        <label><input type="checkbox" id="net-ig" checked> Instagram</label>
        <label><input type="checkbox" id="net-fb"> Facebook</label>
        <label><input type="checkbox" id="net-tt"> TikTok</label>
        <label><input type="checkbox" id="net-li"> LinkedIn</label>
      </div>
    </div>

    <div class="form-group">
      <label>Imágenes</label>
      <div class="img-upload" onclick="document.getElementById('fileInput').click()">
        📸 Haz clic para agregar imágenes
      </div>
      <input type="file" id="fileInput" accept="image/*" multiple style="display: none" onchange="handleFiles()">
      <div class="img-preview" id="imgPreview"></div>
    </div>

    <div class="modal-buttons">
      <button class="cancel" onclick="closeModal()">Cancelar</button>
      <button class="save" onclick="savePost()">Guardar Post</button>
    </div>
  </div>
</div>

<script>
let currentUser = null;
let posts = [];
let uploadedImages = [];
let editingId = null;
let currentMonth = new Date().getMonth();
let currentYear = new Date().getFullYear();

const MONTHS = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
const DAYS = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];

function login() {
  const email = document.getElementById('loginEmail').value;
  const password = document.getElementById('loginPassword').value;
  const error = document.getElementById('loginError');
  
  if (email === 'admin@tsur.com' && password === 'admin123') {
    currentUser = { email: email };
    error.textContent = '';
    showAdminScreen();
    renderCalendar();
    renderPosts();
  } else {
    error.textContent = 'Email o contraseña incorrectos';
  }
}

function logout() {
  currentUser = null;
  posts = [];
  document.querySelector('.login-screen').classList.add('show');
  document.querySelector('.admin-screen').classList.remove('show');
}

function showAdminScreen() {
  document.querySelector('.login-screen').classList.remove('show');
  document.querySelector('.admin-screen').classList.add('show');
  document.getElementById('userEmail').textContent = currentUser.email;
}

function openNewPost(dateStr) {
  editingId = null;
  uploadedImages = [];
  document.getElementById('modalTitle').textContent = 'Nuevo Post';
  document.getElementById('postTitle').value = '';
  document.getElementById('postDate').value = dateStr || '';
  document.getElementById('postCopy').value = '';
  document.getElementById('fileInput').value = '';
  document.getElementById('imgPreview').innerHTML = '';
  document.getElementById('net-ig').checked = true;
  document.getElementById('net-fb').checked = false;
  document.getElementById('net-tt').checked = false;
  document.getElementById('net-li').checked = false;
  document.getElementById('postModal').classList.add('show');
}

function closeModal() {
  document.getElementById('postModal').classList.remove('show');
}

function savePost() {
  const title = document.getElementById('postTitle').value.trim();
  const date = document.getElementById('postDate').value;
  const copy = document.getElementById('postCopy').value.trim();
  
  if (!title || !date || !copy) {
    alert('Por favor completa: Título, Fecha y Texto');
    return;
  }

  const networks = [];
  if (document.getElementById('net-ig').checked) networks.push('Instagram');
  if (document.getElementById('net-fb').checked) networks.push('Facebook');
  if (document.getElementById('net-tt').checked) networks.push('TikTok');
  if (document.getElementById('net-li').checked) networks.push('LinkedIn');

  const postData = {
    id: editingId || 'post_' + Date.now(),
    title,
    date,
    copy,
    networks,
    images: uploadedImages,
    status: 'pending',
    comments: []
  };

  if (editingId) {
    const idx = posts.findIndex(p => p.id === editingId);
    if (idx >= 0) posts[idx] = postData;
  } else {
    posts.push(postData);
  }

  closeModal();
  renderCalendar();
  renderPosts();
  updateStats();
}

function deletePost(id) {
  if (confirm('¿Eliminar este post?')) {
    posts = posts.filter(p => p.id !== id);
    renderCalendar();
    renderPosts();
    updateStats();
  }
}

function editPost(id) {
  const post = posts.find(p => p.id === id);
  editingId = id;
  uploadedImages = [...(post.images || [])];
  
  document.getElementById('modalTitle').textContent = 'Editar Post';
  document.getElementById('postTitle').value = post.title;
  document.getElementById('postDate').value = post.date;
  document.getElementById('postCopy').value = post.copy;
  document.getElementById('net-ig').checked = post.networks.includes('Instagram');
  document.getElementById('net-fb').checked = post.networks.includes('Facebook');
  document.getElementById('net-tt').checked = post.networks.includes('TikTok');
  document.getElementById('net-li').checked = post.networks.includes('LinkedIn');
  
  renderImagePreview();
  document.getElementById('postModal').classList.add('show');
}

function updateStatus(id, status) {
  const post = posts.find(p => p.id === id);
  if (post) {
    post.status = status;
    renderPosts();
    updateStats();
  }
}

function handleFiles() {
  const files = document.getElementById('fileInput').files;
  Array.from(files).forEach(file => {
    if (uploadedImages.length < 6) {
      const reader = new FileReader();
      reader.onload = (e) => {
        uploadedImages.push(e.target.result);
        renderImagePreview();
      };
      reader.readAsDataURL(file);
    }
  });
}

function renderImagePreview() {
  const preview = document.getElementById('imgPreview');
  preview.innerHTML = uploadedImages.map((img, idx) => `
    <div class="img-thumb">
      <img src="${img}">
      <button class="img-remove" onclick="removeImage(${idx})">×</button>
    </div>
  `).join('');
}

function removeImage(idx) {
  uploadedImages.splice(idx, 1);
  renderImagePreview();
}

function renderCalendar() {
  document.getElementById('calendarMonthYear').textContent = MONTHS[currentMonth] + ' ' + currentYear;
  
  const cal = document.getElementById('calendar');
  cal.innerHTML = '';
  
  DAYS.forEach(d => {
    const h = document.createElement('div');
    h.className = 'day-header';
    h.textContent = d;
    cal.appendChild(h);
  });

  const first = new Date(currentYear, currentMonth, 1).getDay();
  const days = new Date(currentYear, currentMonth + 1, 0).getDate();

  for (let i = 0; i < first; i++) {
    const d = new Date(currentYear, currentMonth, 0 - first + i + 2);
    const cell = document.createElement('div');
    cell.className = 'day other-month';
    cell.innerHTML = `<div class="day-number">${d.getDate()}</div>`;
    cal.appendChild(cell);
  }

  for (let d = 1; d <= days; d++) {
    const dt = new Date(currentYear, currentMonth, d);
    const iso = formatDateISO(dt);
    const dayPosts = posts.filter(p => p.date === iso);
    
    const cell = document.createElement('div');
    cell.className = 'day';
    cell.innerHTML = `<div class="day-number">${d}</div><div class="day-posts">${dayPosts.map(p => `<div class="day-post ${p.status}" onclick="editPost('${p.id}')" title="${p.title}">${p.title}</div>`).join('')}</div>`;
    cell.onclick = () => openNewPost(iso);
    cal.appendChild(cell);
  }

  const rem = 42 - (first + days);
  for (let i = 1; i <= rem; i++) {
    const d = new Date(currentYear, currentMonth + 1, i);
    const cell = document.createElement('div');
    cell.className = 'day other-month';
    cell.innerHTML = `<div class="day-number">${d.getDate()}</div>`;
    cal.appendChild(cell);
  }
}

function prevMonth() {
  currentMonth--;
  if (currentMonth < 0) { currentMonth = 11; currentYear--; }
  renderCalendar();
}

function nextMonth() {
  currentMonth++;
  if (currentMonth > 11) { currentMonth = 0; currentYear++; }
  renderCalendar();
}

function renderPosts() {
  const container = document.getElementById('postsContainer');
  
  if (posts.length === 0) {
    container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 60px 20px; color: #a0a0b0;"><p style="font-size: 18px; margin-bottom: 10px;">📭 No hay posts aún</p><p style="font-size: 13px;">Crea tu primer post para comenzar</p></div>';
    return;
  }

  container.innerHTML = posts.map(p => {
    let imgHtml = '';
    if (p.images && p.images.length > 0) {
      imgHtml = `<img src="${p.images[0]}" class="post-image">`;
    }

    return `
      <div class="post-card">
        <div class="post-header">
          <div class="post-title">${p.title}</div>
          <div class="post-meta">
            <span>${p.date}</span>
            <span class="post-status status-${p.status}">
              ${p.status === 'approved' ? '✓ Aprobado' : '○ Pendiente'}
            </span>
          </div>
        </div>
        ${imgHtml}
        <div class="post-body">
          <div class="post-copy">${p.copy}</div>
          <div class="post-networks">
            ${p.networks.map(n => `<span class="post-network">${n}</span>`).join('')}
          </div>
        </div>
        <div class="post-actions">
          <button onclick="editPost('${p.id}')">✏️ Editar</button>
          <button onclick="deletePost('${p.id}')">🗑 Eliminar</button>
          <button onclick="updateStatus('${p.id}', 'approved')">✓ Aprobar</button>
        </div>
      </div>
    `;
  }).join('');
}

function updateStats() {
  const total = posts.length;
  const approved = posts.filter(p => p.status === 'approved').length;
  const pending = posts.filter(p => p.status === 'pending').length;
  const rejected = posts.filter(p => p.status === 'rejected').length;

  document.getElementById('statTotal').textContent = total;
  document.getElementById('statApproved').textContent = approved;
  document.getElementById('statPending').textContent = pending;
  document.getElementById('statRejected').textContent = rejected;
}

function formatDateISO(date) {
  return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0') + '-' + String(date.getDate()).padStart(2, '0');
}

updateStats();
</script>

</body>
</html>
